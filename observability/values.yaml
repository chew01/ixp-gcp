# Unified Observability Stack Configuration
# kube-prometheus-stack values for Prometheus + Grafana

# ==============================================================================
# Grafana Configuration
# ==============================================================================
grafana:
  adminPassword: "admin"
  
  # Enable sidecars for automatic datasource and dashboard loading
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      searchNamespace: observability
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: observability
      folder: /tmp/dashboards
      defaultFolderName: "IXP Dashboards"
  
  # Disable persistence for local/minikube development
  persistence:
    enabled: false
  
  # Expose Grafana metrics
  metrics:
    enabled: true
  
  # Provision datasources directly via Helm
  additionalDataSources:
    - name: Jaeger
      type: jaeger
      url: http://jaeger.observability.svc.cluster.local:16686
      access: proxy
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy

# ==============================================================================
# Prometheus Configuration
# ==============================================================================
prometheus:
  prometheusSpec:
    # Scrape ALL ServiceMonitors in the cluster (not just helm releases)
    serviceMonitorSelectorNilUsesHelmValues: false
    
    # Disable persistence for local/minikube
    storageSpec: {}
    
    # Additional scrape configs to scrape OTEL Collector
    additionalScrapeConfigs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
          - targets: ['otel-collector-opentelemetry-collector.observability.svc.cluster.local:8889']
            labels:
              service: 'otel-collector'

# kube-prometheus-stack global defaults
defaultRules:
  create: true
  rules:
    etcd: false

prometheus-node-exporter:
  prometheus:
    monitor:
      interval: "10s"

kube-state-metrics:
  prometheus:
    monitor:
      interval: "10s"

# ==============================================================================
# Optional: Disable components not needed for local development
# ==============================================================================
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    # Secret must contain key 'bot-token'.
    secrets:
      - alertmanager-telegram-secret

  # Baseline routing so alerts are grouped and handled deterministically.
  # Default receiver is 'null' until an external receiver (e.g. Telegram) is enabled.
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by: ["component", "signal", "severity"]
      group_wait: 20s
      group_interval: 10m
      repeat_interval: 4h
      routes:
        - receiver: "telegram"
          matchers:
            - 'alertname =~ "^IXP.*"'
            - 'severity =~ "warning|critical"'

    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-secret/bot-token
            # Replace with your Telegram chat ID (integer).
            chat_id: 6269922199
            parse_mode: HTML
            send_resolved: true

    inhibit_rules:
      # If a critical alert is active for a component, suppress warning-level
      # alerts from the same component to avoid flood from symptom cascades.
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity = warning"]
        equal: ["component"]

      # When Atomix is critically unhealthy, suppress common secondary
      # telemetry and auction symptom warnings during the same incident.
      - source_matchers:
          - 'alertname =~ "IXPAtomix(OperationFailuresCritical|NearTotalFailure|CriticalFailureRate|TotalFailureImminent)"'
        target_matchers:
          - 'alertname =~ "IXPTelemetryLowFlowConsumption|IXPAuctionNoBidsAcrossIntervals|IXPAPIGatewayHighErrorRateWarning|IXPAPIGatewaySuccessRateLow"'
        equal: []

  # Telegram wiring:
  # 1) Create secret in observability namespace:
  #    kubectl -n observability create secret generic alertmanager-telegram-secret \
  #      --from-literal=bot-token='<telegram-bot-token>'
  # 2) Set the Telegram chat ID in this file under:
  #    alertmanager.config.receivers[name=telegram].telegram_configs[0].chat_id
  # 3) Redeploy observability stack.

# Keep Prometheus Operator enabled (required for ServiceMonitors)
prometheusOperator:
  enabled: true