apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ixp-alert-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: ixp-alert-rules
    release: observability
spec:
  groups:
    - name: ixp-availability
      rules:
        - alert: IXPApiGatewayUnavailable
          expr: kube_deployment_status_replicas_available{namespace="default",deployment="api-gateway"} < kube_deployment_spec_replicas{namespace="default",deployment="api-gateway"}
          for: 15s
          labels:
            severity: critical
            component: api-gateway
          annotations:
            summary: "API gateway deployment unavailable"
            description: |
              Available replicas are below desired for at least 15s.
              Observed available: {{ $value }}.
              Suspected causes:
              - Pod crash or failing readiness probe.
              - Scheduling failure (insufficient resources, cordoned node).
              - Ongoing rollout with unhealthy new pods.

    - name: ixp-system-health
      interval: 30s  # Evaluate every 30s for faster detection
      rules:
        # ============================================================
        # Atomix Store Dependency Chain Monitoring
        # ============================================================
        # These alerts trigger when the consensus store becomes unavailable
        # or severely degraded, breaking the dependency chain for place bids,
        # get flows, and other critical operations.

        - alert: IXPAtomixOperationFailuresCritical
          expr: sum(rate(ixp_api_atomix_operation_errors_total{operation!="bootstrap"}[1m])) > 0
          for: 5s
          labels:
            severity: critical
            component: api-gateway
            signal: dependency-chain-broken
          annotations:
            summary: "Atomix operation failures detected"
            description: |
              API Gateway is reporting Atomix errors.
              Error rate: {{ $value }}/sec.
              Impact: bid and flow operations may fail.
              Suspected causes:
              - Consensus quorum loss (insufficient Atomix replicas after scale-down).
              - Atomix leader unavailable or election instability.
              - Atomix replicas down or not Ready.
              - Connectivity issue between API and Atomix.
              - Atomix overloaded.

        - alert: IXPAtomixNearTotalFailure
          expr: rate(ixp_api_atomix_operation_errors_total{operation!="bootstrap"}[1m]) > 0.5
          for: 5s
          labels:
            severity: critical
            component: api-gateway
            signal: store-unavailable
          annotations:
            summary: "Atomix near-total failure"
            description: |
              Atomix error rate is critically high.
              Error rate: {{ $value }}/sec.
              Impact: most control-plane operations are failing.
              Suspected causes:
              - Atomix scaled down or crashed.
              - Cluster or network partition.
              - Severe resource exhaustion.

        - alert: IXPAtomixConnectionErrors
          expr: sum(rate(ixp_api_atomix_operation_errors_total{error_type="connection"}[1m])) > 0
          for: 5s
          labels:
            severity: critical
            component: api-gateway
            signal: connectivity-broken
          annotations:
            summary: "Atomix connection errors detected"
            description: |
              API cannot establish connections to Atomix.
              Error rate: {{ $value }}/sec.
              Suspected causes:
              - Atomix service/pods unavailable.
              - NetworkPolicy or DNS/connectivity issue.
              - Atomix listener not accepting connections.

        - alert: IXPAtomixVeryHighLatencyCritical
          expr: histogram_quantile(0.99, sum by (le) (rate(ixp_api_atomix_operation_duration_milliseconds_bucket[2m]))) > 1000
          for: 15s
          labels:
            severity: critical
            signal: congestion
            component: api-gateway
          annotations:
            summary: "Atomix p99 latency critical"
            description: |
              Atomix p99 latency is {{ $value }}ms (threshold: 1000ms).
              Impact: control decisions may miss deadlines.
              Suspected causes:
              - Consensus quorum degradation or unstable leader election.
              - High request volume.
              - Atomix under CPU or memory pressure.
              - Network congestion.
              - Atomix instance failure.

        # ============================================================
        # API Gateway Request Latency Monitoring
        # ============================================================
        # Detects congestion caused by high request volume (e.g., bid spam)
        # Uses HTTP server metrics automatically instrumented by otelhttp.NewHandler

        - alert: IXPAPIGatewayBidCongestion
          expr: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{exported_job="api-gateway",http_request_method="POST"}[2m]))) > 0.5
          for: 5s
          labels:
            severity: warning
            signal: congestion
            component: api-gateway
          annotations:
            summary: "API POST latency warning"
            description: |
              API POST p99 latency is {{ $value }}s (threshold: 0.5s).
              Suspected causes:
              - Bid traffic spike or spam.
              - Upstream dependency slowdown.
              - API resource saturation.

        - alert: IXPAPIGatewayBidRateHigh
          expr: sum(rate(ixp_bid_submitted_total[1m])) > 8.33
          for: 5s
          labels:
            severity: critical
            signal: potential-ddos
            component: api-gateway
          annotations:
            summary: "API DDoS attack suspected - bid flood detected"
            description: |
              Bid submission rate is {{ $value }}/sec (threshold: >8.33/sec = 500/min).
              Impact: potential DDoS or malicious bid flooding attack detected.
              Action: investigate source customer IDs and originating ports immediately.
              Suspected causes:
              - DDoS attack on bid endpoint.
              - Compromised customer launching bid spam.
              - Malicious flood from unauthorized source.

        - alert: IXPAPIGatewayBidHighLatencyCritical
          expr: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{exported_job="api-gateway",http_request_method="POST"}[2m]))) > 1.0
          for: 5s
          labels:
            severity: critical
            signal: congestion
            component: api-gateway
          annotations:
            summary: "API POST latency critical"
            description: |
              API POST p99 latency is {{ $value }}s (threshold: 1.0s).
              Impact: POST path is severely delayed.
              Suspected causes:
              - Sustained bid spam load.
              - Atomix dependency congestion.
              - API pod CPU/memory pressure.

    # ============================================================
    # Service Availability via Error Rates
    # ============================================================
    # Real availability detection: based on actual request success/failures
    # rather than deployment replicas (which can be up but unresponsive)

    - name: ixp-service-availability
      interval: 30s
      rules:
        - alert: IXPAPIGatewayHighErrorRateCritical
          # 5xx error rate > 5% for 10s = service severely degraded
          expr: |
            (
              sum(rate(http_server_responses_total{job="api-gateway",http_status=~"5.."}[2m]))
              /
              sum(rate(http_server_responses_total{job="api-gateway"}[2m]))
            ) > 0.05
          for: 10s
          labels:
            severity: critical
            signal: service-unavailable
            component: api-gateway
          annotations:
            summary: "API high 5xx error rate"
            description: |
              API 5xx rate is {{ $value | humanizePercentage }} (threshold: 5%).
              Impact: service is degraded and requests are failing.
              Suspected causes:
              - Dependency outage (Atomix or Kafka).
              - API runtime failure.
              - Resource exhaustion.

        - alert: IXPAPIGatewayHighErrorRateWarning
          # 5xx error rate > 1% for 20s = degradation detected
          expr: |
            (
              sum(rate(http_server_responses_total{job="api-gateway",http_status=~"5.."}[2m]))
              /
              sum(rate(http_server_responses_total{job="api-gateway"}[2m]))
            ) > 0.01
          for: 20s
          labels:
            severity: warning
            signal: service-degrading
            component: api-gateway
          annotations:
            summary: "API elevated 5xx error rate"
            description: |
              API 5xx rate is {{ $value | humanizePercentage }} (threshold: 1%).
              Suspected causes:
              - Early dependency degradation.
              - Transient rollout issue.
              - Traffic burst.

        - alert: IXPAPIGatewaySuccessRateLow
          # Success rate < 95% for 45s = significant failures
          expr: |
            (
              sum(rate(http_server_responses_total{job="api-gateway",http_status=~"2.."}[2m]))
              /
              sum(rate(http_server_responses_total{job="api-gateway"}[2m]))
            ) < 0.95
          for: 45s
          labels:
            severity: warning
            signal: service-degradation
            component: api-gateway
          annotations:
            summary: "API success rate low"
            description: |
              API success rate is {{ $value | humanizePercentage }} (threshold: 95%).
              Suspected causes:
              - Atomix/Kafka failures.
              - Network or DNS instability.
              - API overload.

    - name: ixp-auction-health
      interval: 30s
      rules:
        - alert: IXPAuctionNoBidsAcrossIntervals
          expr: |
            sum(increase(ixp_auction_no_bid_intervals_total[10m])) >= 3
            and
            sum(increase(ixp_auction_runs_total[10m])) >= 3
          for: 1m
          labels:
            severity: warning
            component: auction-runner
            signal: no-bid-activity
          annotations:
            summary: "Auction runner receiving no bids"
            description: |
              No bids observed across recent auction intervals.
              Observed no-bid intervals: {{ $value }}.
              Suspected causes:
              - Consensus store unavailable, so bid writes/reads are failing.
              - Atomix quorum loss after consensus replica scale-down.
              - Agents not running.
              - API bid submissions failing.
              - No input traffic scenario.
              - Auction scheduling or processing delay.

    # ============================================================
    # Dependency Chain Failure Refined Alerts
    # ============================================================
    # Progressive severity levels for Atomix failures

    - name: ixp-dependency-chain
      interval: 30s
      rules:
        - alert: IXPAtomixCriticalFailureRate
          # > 0.1 errors/sec for 5s = critical
          expr: sum(rate(ixp_api_atomix_operation_errors_total{operation!="bootstrap"}[1m])) > 0.1
          for: 5s
          labels:
            severity: critical
            component: consensus-store
            signal: dependency-broken
          annotations:
            summary: "Atomix critical failure rate"
            description: |
              Atomix error rate is {{ $value }}/sec (threshold: 0.1).
              Impact: bid and flow paths are heavily affected.
              Suspected causes:
              - Consensus quorum loss (replicas below required majority).
              - Leader-election instability in Atomix consensus group.
              - Atomix partially unavailable.
              - Failed leader/election instability.
              - Severe network or resource issues.

        - alert: IXPAtomixTotalFailureImminent
          # > 0.5 errors/sec = almost complete failure
          expr: sum(rate(ixp_api_atomix_operation_errors_total{operation!="bootstrap"}[1m])) > 0.5
          for: 5s
          labels:
            severity: critical
            component: consensus-store
            signal: store-unavailable
          annotations:
            summary: "Atomix total failure imminent"
            description: |
              Atomix error rate is {{ $value }}/sec (threshold: 0.5).
              Impact: dependency chain is effectively unavailable.
              Suspected causes:
              - Atomix scaled down below quorum or fully down.
              - Consensus leader unavailable after scale-down.
              - Major network outage.
              - Cluster-level resource failure.

    # ============================================================
    # Latency Alerts (Congestion Detection)
    # ============================================================
    # Progressive latency thresholds across multiple percentiles

    - name: ixp-congestion-detection
      interval: 30s
      rules:
        - alert: IXPAtomixP99LatencyCritical
          # p99 latency > 1000ms for 15s = severe congestion
          expr: histogram_quantile(0.99, sum by (le) (rate(ixp_api_atomix_operation_duration_milliseconds_bucket[2m]))) > 1000
          for: 15s
          labels:
            severity: critical
            signal: congestion
            component: consensus-store
          annotations:
            summary: "Atomix p99 latency critical"
            description: |
              Atomix p99 latency is {{ $value }}ms (threshold: 1000ms).
              Impact: severe control-path slowdown.
              Suspected causes:
              - Consensus quorum degradation or unstable leader election.
              - Bid spam or request burst.
              - Atomix under heavy load.
              - Network congestion.
              - Atomix instance failure.

    - name: ixp-telemetry
      interval: 30s  # Evaluate every 30s for telemetry health
      rules:
        # ============================================================
        # Telemetry Service Data Pipeline Monitoring
        # ============================================================
        # Alerts for the telemetry data collection pipeline:
        # Data Plane (switch) → Kafka → Telemetry Service → Atomix → API Gateway

        - alert: IXPTelemetryNoFlowsProduced
          # No flows published to Atomix for 5 minutes = telemetry pipeline broken
          expr: sum(rate(telemetry_flow_metrics_published_total[5m])) == 0
          for: 5m
          labels:
            severity: critical
            component: telemetry-service
            signal: pipeline-broken
          annotations:
            summary: "No telemetry flows published"
            description: |
              Telemetry publish rate is zero over the last 5 minutes.
              Impact: /flows may return missing updates and bidding loop degrades.
              Suspected causes:
              - Kafka unavailable or disconnected.
              - Telemetry consumer stalled.
              - Upstream telemetry source stopped.
              - Atomix write path failing.

        - alert: IXPTelemetryKafkaConsumerErrors
          # Persistent errors consuming from Kafka
          expr: sum(increase(ixp_telemetry_kafka_consumer_errors_total[5m])) > 10
          for: 2m
          labels:
            severity: warning
            component: telemetry-service
            signal: kafka-consumer-errors
          annotations:
            summary: "Telemetry Kafka consumer errors"
            description: |
              Telemetry service reported {{ $value }} Kafka consumer errors in 5 minutes.
              Suspected causes:
              - Kafka broker/network instability.
              - Topic rebalance or partition issue.
              - Message decode/schema mismatch.

        - alert: IXPTelemetryAtomixWriteErrors
          # Cannot write flow metrics to Atomix storage
          expr: sum(increase(ixp_telemetry_atomix_operation_errors_total[5m])) > 5
          for: 2m
          labels:
            severity: warning
            component: telemetry-service
            signal: atomix-write-failure
          annotations:
            summary: "Telemetry Atomix write errors"
            description: |
              Telemetry service reported {{ $value }} Atomix write failures in 5 minutes.
              Impact: flow updates consumed from Kafka are not persisted.
              Suspected causes:
              - Atomix degraded or unavailable.
              - Telemetry service connectivity issue.
              - Write timeout under load.

        - alert: IXPTelemetryLowFlowConsumption
          # Flows consumed are dropping (kafka not flowing)
          expr: sum(rate(telemetry_flows_consumed_total[5m])) < 1
          for: 3m
          labels:
            severity: warning
            component: telemetry-service
            signal: low-data-rate
          annotations:
            summary: "Telemetry flow consumption low"
            description: |
              Telemetry consume rate is {{ $value }}/sec (threshold: < 1).
              Suspected causes:
              - Upstream producer not sending telemetry.
              - Kafka delivery issue.
              - Telemetry consumer lag or stall.
