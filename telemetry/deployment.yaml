apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-service
  template:
    metadata:
      labels:
        app: telemetry-service
        proxy.atomix.io/inject: "true"
        proxy.atomix.io/profile: "ixp-storage-profile"
    spec:
      containers:
      - name: telemetry-service
        image: telemetry-service:local
        env:
          - name: SCENARIO_PATH
            value: /etc/scenario/scenario.yaml
          - name: OTEL_SERVICE_NAME
            value: telemetry-service
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
        volumeMounts:
          - name: scenario-volume
            mountPath: /etc/scenario
            readOnly: true
          - name: kafka-tls
            mountPath: /etc/kafka-tls
            readOnly: true

      volumes:
        - name: scenario-volume
          configMap:
            name: test-scenario
        - name: kafka-tls
          secret:
            secretName: kafka-tls
            optional: true