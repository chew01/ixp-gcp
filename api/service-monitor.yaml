# =============================================================================
# DEPRECATED: This ServiceMonitor is no longer used
# =============================================================================
#
# The API Gateway now pushes metrics to the OpenTelemetry Collector via OTLP.
# Prometheus scrapes metrics from the OTEL Collector's Prometheus endpoint,
# not directly from the API service.
#
# Architecture: API → OTEL Collector → Prometheus
#
# This file is kept for reference but is not applied during deployment.
# See: docs/observability-architecture.md
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-monitor
  namespace: observability
spec:
  selector:
    matchLabels:
      app: api-gateway
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      interval: 1s