apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        proxy.atomix.io/inject: "true"
        proxy.atomix.io/profile: "ixp-storage-profile"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:local
        env:
          - name: OTEL_SERVICE_NAME
            value: api-gateway
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
          - name: TELEMETRY_MODE
            value: "collector"
          - name: SCENARIO_PATH
            value: /etc/scenario/scenario.yaml
        ports:
          - name: http
            containerPort: 8080
          - name: metrics
            containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
          - name: scenario-volume
            mountPath: /etc/scenario
            readOnly: true
      volumes:
        - name: scenario-volume
          configMap:
            name: test-scenario
---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway 
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
