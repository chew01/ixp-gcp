apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-agent-as12345
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-agent-as12345
  template:
    metadata:
      labels:
        app: customer-agent-as12345
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: customer-agent
        image: customer-agent:local
        imagePullPolicy: Never
        env:
          - name: CUSTOMER_ID
            value: "peer-vlan11"
          - name: API_BASE_URL
            value: "http://api-gateway"
          - name: SCENARIO_PATH
            value: /etc/scenario/scenario.yaml
          - name: OTEL_SERVICE_NAME
            value: customer-agent
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
          - name: TELEMETRY_MODE
            value: "collector"
        volumeMounts:
          - name: scenario-volume
            mountPath: /etc/scenario
            readOnly: true
      volumes:
        - name: scenario-volume
          configMap:
            name: test-scenario

