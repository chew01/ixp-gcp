## Grafana Helm values for local/dev deployment
## This file configures Grafana for the monitoring namespace used by the deploy script.

replicaCount: 1

# Disable persistence for local/minikube development
persistence:
  enabled: false

service:
  type: ClusterIP

# Admin credentials (change for production)
adminPassword: "admin"

# Enable the sidecar to automatically pick up ConfigMaps labeled with
# `grafana_datasource: "1"` (this matches the ConfigMap applied by
# `deploy-observability.sh`). The sidecar will look in the `monitoring`
# namespace for datasources.
sidecar:
  datasources:
    enabled: true
    label: grafana_datasource
    searchNamespace: monitoring
  dashboards:
    enabled: false

# Optional: expose metrics from Grafana for Prometheus scraping
metrics:
  enabled: true

# Resources are left unset for local/dev deployment. Add limits/requests for prod.
# resources: {}

# Additional helpful defaults for dev convenience
ingress:
  enabled: false
