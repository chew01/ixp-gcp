# OpenTelemetry Collector Configuration
# This values.yaml configures the collector to receive OTLP data from your services
# and export traces to Jaeger, metrics to Prometheus, and logs to Loki

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

# Expose Prometheus metrics endpoint for scraping
service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  jaeger-grpc:
    enabled: false
  jaeger-thrift-http:
    enabled: false
  zipkin:
    enabled: false

# OpenTelemetry Collector configuration
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    # Memory limiter prevents unbounded queue growth and OOM
    memory_limiter:
      check_interval: 1s
      limit_mib: 1024
      spike_limit_mib: 256

    batch:
      timeout: 10s                    # Increased from 1s to allow more time for processing
      send_batch_size: 256            # Reduced from 512 to send smaller batches faster
      send_batch_max_size: 512        # Max batch size to prevent unlimited growth

    # Tail sampling for traces: keep 100% errors, 5% of successful traces
    # This reduces storage costs while retaining all error telemetry
    tail_sampling:
      decision_wait: 10s
      num_traces: 100
      expected_new_traces_per_sec: 10
      policies:
        # Policy 1: Always sample ERROR status traces
        - name: error-traces
          type: status_code
          status_code:
            status_codes:
              - ERROR
        # Policy 2: Sample 5% of everything else (healthy traces)
        - name: probabilistic-healthy
          type: probabilistic
          probabilistic:
            sampling_percentage: 5
    
    # NEW: Filter processor for logs
    filter/logs:
      error_mode: ignore
      logs:
        log_record:
          # This statement drops any log where the severity is INFO or DEBUG
          - 'severity_number <= 9'

  exporters:
    # Export traces to Jaeger (all-in-one deployment)
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    
    # Export logs to Loki
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    
    # Export metrics to Prometheus (expose endpoint for scraping)
    prometheus:
      endpoint: 0.0.0.0:8889
      # namespace: ixp  # Removed to avoid double ixp_ prefix since instruments already have ixp. prefix
      const_labels:
        environment: development
    
    # Debug exporter for troubleshooting - outputs all signals (logs, metrics, traces) to stdout
    # This ensures you can see real-time logs via kubectl logs
    debug:
      verbosity: detailed

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki, debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus, debug]

# ServiceMonitor to register OTEL collector metrics with Prometheus operator
# This tells Prometheus to scrape metrics from the OTEL collector's prometheus exporter (:8889)
serviceMonitor:
  enabled: true
  namespace: observability
  labels:
    release: observability
  interval: 10s
  scrapeTimeout: 10s
  relabelings: []
  endpoints:
    - port: prometheus
      interval: 30s