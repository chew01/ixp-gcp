# OpenTelemetry Collector Configuration
# This values.yaml configures the collector to receive OTLP data from your services
# and export traces to Jaeger, metrics/logs to logging

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

# OpenTelemetry Collector configuration
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  exporters:
    otlp/traces:
      endpoint: jaeger.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/logs:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
    otlphttp/metrics:
      endpoint: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/otlp
    debug:
      verbosity: detailed

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [otlp/traces, debug]
      logs:
        receivers: [otlp]
        exporters: [otlphttp/logs, debug]
      metrics:
        receivers: [otlp]
        exporters: [otlphttp/metrics, debug]
