# OpenTelemetry Collector Configuration
# This values.yaml configures the collector to receive OTLP data from your services
# and export traces to Jaeger, metrics to Prometheus, and logs to Loki

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

# Expose Prometheus metrics endpoint for scraping
service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  jaeger-grpc:
    enabled: false
  jaeger-thrift-http:
    enabled: false
  zipkin:
    enabled: false

# OpenTelemetry Collector configuration
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1024

  exporters:
    # Export traces to Jaeger (all-in-one deployment)
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    
    # Export logs to Loki
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    
    # Export metrics to Prometheus (expose endpoint for scraping)
    prometheus:
      endpoint: 0.0.0.0:8889
      # namespace: ixp  # Removed to avoid double ixp_ prefix since instruments already have ixp. prefix
      const_labels:
        environment: development
    
    # Debug exporter for troubleshooting
    debug:
      verbosity: detailed

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/jaeger, debug]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki, debug]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus, debug]
