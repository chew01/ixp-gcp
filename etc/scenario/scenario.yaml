version: v1
name: real

auction_result_kafka_topic: auction-results
telemetry_kafka_topic: switch-telemetry

reservation_price: 50
auction_interval: 30s
telemetry_interval: 1s

# The physical switch has no retrievable identity yet; this label is used only for
# internal port-assignment validation. Update once the switch can be identified.
switches:
  - id: sw-real
    ingress_ports: [52, 60]
    egress_ports: [132]
    max_capacity: 1000  # TODO: replace with measured egress line-rate (kbps)

customers:
  - id: peer-vlan11
    switch_id: sw-real
    ingress_ports: [60]   # flow: ingress=60, egress=132, source_vlan=11
    strategy: conservative
    valuation_per_unit: 500

  - id: peer-vlan38
    switch_id: sw-real
    ingress_ports: [52]   # flow: ingress=52, egress=132, source_vlan=38
    strategy: conservative
    valuation_per_unit: 500
